<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Noter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1e1e2e;
    --surface: #252535;
    --surface2: #2e2e45;
    --border: #3a3a55;
    --accent: #7c6af7;
    --accent-hover: #9580ff;
    --text: #cdd6f4;
    --text-dim: #7f849c;
    --success: #a6e3a1;
    --error: #f38ba8;
    --warn: #f9e2af;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 12px 16px;
    gap: 10px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
    flex: 1;
  }
  header h1 span { color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 6px; }

  /* ── Meta fields ── */
  #meta {
    flex-shrink: 0;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--text-dim); }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    flex-wrap: wrap;
  }
  .tb-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 9px;
    transition: all 0.1s;
    white-space: nowrap;
  }
  .tb-btn:hover {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }
  .tb-sep {
    width: 1px;
    background: var(--border);
    margin: 2px 4px;
  }

  /* ── Editor ── */
  #editor-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  #editor {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.7;
    padding: 14px 16px;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
    height: 100%;
  }
  #editor:focus { border-color: var(--accent); }

  /* ── Footer ── */
  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn {
    background: var(--accent);
    border: none;
    border-radius: 7px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.secondary:hover { background: var(--border); }
  .btn.icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
  }
  .btn.icon-btn:hover { color: var(--text); border-color: var(--accent); }

  #status {
    flex: 1;
    font-size: 12px;
    color: var(--text-dim);
  }
  #status.ok { color: var(--success); }
  #status.err { color: var(--error); }
  #status.busy { color: var(--warn); }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 440px;
    max-width: 95vw;
  }
  .modal h2 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .modal .field { margin-bottom: 12px; }
  .modal .field input {
    width: 100%;
    font-family: monospace;
  }
  .modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .modal small {
    display: block;
    margin-top: 4px;
    color: var(--text-dim);
    font-size: 11px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Voice recording state ── */
  .tb-btn.recording {
    background: var(--error);
    border-color: var(--error);
    color: #fff;
    animation: pulse-rec 1s ease-in-out infinite;
  }
  @keyframes pulse-rec { 0%,100%{opacity:1} 50%{opacity:.55} }

  /* ── OCR mode selector panel ── */
  #ocr-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    flex-shrink: 0;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #ocr-panel.open { display: flex; }
  #ocr-panel > span {
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
    min-width: 100%;
  }

  /* ── Mobile / touch screens ── */
  @media (pointer: coarse) {
    /* Larger touch targets */
    .tb-btn { padding: 10px 12px; font-size: 14px; }
    .tb-sep { margin: 4px 6px; }
    .btn { padding: 11px 16px; font-size: 14px; }

    /* Prevent iOS auto-zoom on focused inputs (must be ≥ 16px) */
    .field input, #editor { font-size: 16px; }

    /* Status bar wraps below buttons */
    footer { flex-wrap: wrap; gap: 8px; }
    #status { flex-basis: 100%; text-align: center; }
  }

  /* Very narrow screens (iPhone SE etc.) */
  @media (max-width: 390px) {
    #app { padding: 8px 10px; gap: 8px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <h1>Web Noter <span id="dirty-indicator"></span></h1>
    <button class="btn icon-btn" onclick="if(!isDirty||confirm('有未儲存的內容，確定重新載入？'))location.reload()" title="重新載入">🔄</button>
    <button class="btn icon-btn" onclick="openSettings()" title="Settings">⚙️ 設定</button>
  </header>

  <!-- Meta fields -->
  <div id="meta">
    <div class="field">
      <label>檔名</label>
      <input id="f-name" type="text" placeholder="my-note.md" spellcheck="false">
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" onclick="listFromGitHub()" title="列出 GitHub 上的 Markdown 檔案">📋 列表</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="applyTemplate('recipe')" title="食譜範本">🍳 食譜</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="voice-btn" onclick="toggleVoice()" title="語音輸入（需 HTTPS）">🎤 語音</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="openPhotoPicker()" title="拍照或選圖 OCR">📷 拍照</button>
  </div>

  <!-- OCR mode selector panel -->
  <div id="ocr-panel">
    <span id="ocr-filename">已選擇圖片：—</span>
    <button class="btn secondary" onclick="runOCR('rough')">🔍 快速辨識（Tesseract）</button>
    <button class="btn secondary" onclick="runOCR('precise')">✨ 精確辨識（Claude）</button>
    <button class="btn icon-btn" onclick="closeOcrPanel()" title="取消">✕</button>
  </div>

  <!-- Editor -->
  <div id="editor-wrap">
    <textarea id="editor" placeholder="在此輸入 Markdown 內容...&#10;&#10;支援標準 Markdown 語法，包含：&#10;- **粗體** 、*斜體*、`程式碼`&#10;- # 標題&#10;- [連結](url)&#10;- ![圖片](url)"></textarea>
  </div>

  <!-- Footer -->
  <footer>
    <button class="btn" onclick="appendToGitHub()">➕ 附加至 GitHub</button>
    <button class="btn secondary" onclick="loadFromGitHub()">📂 載入</button>
    <button class="btn secondary" onclick="overwriteToGitHub()">✏️ 覆蓋寫入</button>
    <span id="status"></span>
  </footer>

</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙️ GitHub 設定</h2>
    <div class="field">
      <label>Personal Access Token (PAT)</label>
      <input id="cfg-pat" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <small>需要 repo 權限。儲存於瀏覽器 localStorage。</small>
    </div>
    <div class="field">
      <label>GitHub 帳號 (Owner)</label>
      <input id="cfg-owner" type="text" placeholder="your-username">
    </div>
    <div class="field">
      <label>Repository 名稱</label>
      <input id="cfg-repo" type="text" placeholder="my-notes">
    </div>
    <div class="field">
      <label>Branch</label>
      <input id="cfg-branch" type="text" placeholder="main">
    </div>
    <div class="field">
      <label>路徑前綴（資料夾）</label>
      <input id="cfg-prefix" type="text" placeholder="notes/">
      <small>例：notes/  表示儲存在 repo 的 notes/ 目錄。留空則存於根目錄。</small>
    </div>
    <div class="field">
      <label>Claude API Key（OCR 精確辨識用）</label>
      <input id="cfg-claude-key" type="password" placeholder="sk-ant-api03-...">
      <small>用於 Claude Vision OCR 精確模式，儲存於 localStorage。選填。</small>
    </div>
    <div class="modal-footer">
      <button class="btn secondary" onclick="closeSettings()">取消</button>
      <button class="btn" onclick="saveSettings()">儲存設定</button>
    </div>
  </div>
</div>

<!-- Hidden photo file picker — no capture attr: iOS shows camera+library sheet automatically -->
<input type="file" id="photo-input" accept="image/*" style="display:none">

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let currentSha = null; // SHA of the file currently loaded (for updates)
let isDirty = false;

const editor = document.getElementById('editor');
const dirtyIndicator = document.getElementById('dirty-indicator');
const status = document.getElementById('status');

// ─────────────────────────────────────────────
//  Config (localStorage)
// ─────────────────────────────────────────────
function getConfig() {
  return {
    pat:       localStorage.getItem('wn_pat')        || '',
    owner:     localStorage.getItem('wn_owner')      || '',
    repo:      localStorage.getItem('wn_repo')       || '',
    branch:    localStorage.getItem('wn_branch')     || 'main',
    prefix:    localStorage.getItem('wn_prefix')     || '',
    claudeKey: localStorage.getItem('wn_claude_key') || '',
  };
}

function openSettings() {
  const c = getConfig();
  document.getElementById('cfg-pat').value        = c.pat;
  document.getElementById('cfg-owner').value      = c.owner;
  document.getElementById('cfg-repo').value       = c.repo;
  document.getElementById('cfg-branch').value     = c.branch;
  document.getElementById('cfg-prefix').value     = c.prefix;
  document.getElementById('cfg-claude-key').value = c.claudeKey;
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function saveSettings() {
  localStorage.setItem('wn_pat',        document.getElementById('cfg-pat').value.trim());
  localStorage.setItem('wn_owner',      document.getElementById('cfg-owner').value.trim());
  localStorage.setItem('wn_repo',       document.getElementById('cfg-repo').value.trim());
  localStorage.setItem('wn_branch',     document.getElementById('cfg-branch').value.trim() || 'main');
  localStorage.setItem('wn_prefix',     document.getElementById('cfg-prefix').value.trim());
  localStorage.setItem('wn_claude_key', document.getElementById('cfg-claude-key').value.trim());
  closeSettings();
  setStatus('設定已儲存', 'ok');
}

// Close modal on overlay click
document.getElementById('settings-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

// ─────────────────────────────────────────────
//  Dirty tracking
// ─────────────────────────────────────────────
editor.addEventListener('input', () => {
  isDirty = true;
  dirtyIndicator.textContent = '●';
  dirtyIndicator.style.color = '#f9e2af';
});

function markClean() {
  isDirty = false;
  dirtyIndicator.textContent = '';
}

// ─────────────────────────────────────────────
//  Status
// ─────────────────────────────────────────────
let statusTimer;
function setStatus(msg, type = '') {
  clearTimeout(statusTimer);
  status.textContent = msg;
  status.className = type;
  if (type === 'ok') {
    statusTimer = setTimeout(() => { status.textContent = ''; status.className = ''; }, 4000);
  }
}

// ─────────────────────────────────────────────
//  Helpers: get filename & path
// ─────────────────────────────────────────────
function getFilename() {
  let name = document.getElementById('f-name').value.trim();
  if (!name) return null;
  if (!name.endsWith('.md')) name += '.md';
  return name;
}

function getFullPath(filename) {
  const cfg = getConfig();
  let prefix = cfg.prefix;
  if (prefix && !prefix.endsWith('/')) prefix += '/';
  return prefix + filename;
}

// ─────────────────────────────────────────────
//  Build Markdown content with frontmatter
// ─────────────────────────────────────────────
function buildContent() {
  const title = document.getElementById('f-name').value.trim().replace(/\.md$/i, '');
  const today = new Date().toISOString().split('T')[0];
  const frontmatter = ['---', `title: "${title}"`, `date: ${today}`, '---', ''].join('\n');
  return frontmatter + editor.value;
}

// ─────────────────────────────────────────────
//  Parse frontmatter when loading
// ─────────────────────────────────────────────
function parseContent(raw) {
  const fmMatch = raw.match(/^---\n([\s\S]*?)\n---\n?/);
  let body = raw;
  let meta = { title: '' };

  if (fmMatch) {
    body = raw.slice(fmMatch[0].length);
    const titleM = fmMatch[1].match(/^title:\s*"?(.+?)"?\s*$/m);
    if (titleM) meta.title = titleM[1];
  }

  return { meta, body };
}

// ─────────────────────────────────────────────
//  GitHub API
// ─────────────────────────────────────────────
async function githubRequest(method, path, body = null) {
  const { pat, owner, repo } = getConfig();
  if (!pat || !owner || !repo) {
    throw new Error('請先在設定中填入 GitHub PAT、Owner 和 Repo。');
  }
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${pat}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

async function saveToGitHub() {
  const filename = getFilename();
  if (!filename) { setStatus('請填寫檔名', 'err'); return; }

  setStatus('儲存中…', 'busy');
  try {
    const content = buildContent();
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const path = getFullPath(filename);
    const { branch } = getConfig();

    const payload = {
      message: `docs: update ${filename}`,
      content: encoded,
      branch,
    };
    if (currentSha) payload.sha = currentSha;

    const result = await githubRequest('PUT', path, payload);
    currentSha = result.content.sha;
    markClean();
    setStatus(`✓ 已儲存 → ${path}`, 'ok');
  } catch (e) {
    setStatus(`✗ 儲存失敗：${e.message}`, 'err');
  }
}

async function loadFromGitHub() {
  const filename = getFilename();
  if (!filename) { setStatus('請填寫要載入的檔名', 'err'); return; }

  setStatus('載入中…', 'busy');
  try {
    const path = getFullPath(filename);
    const data = await githubRequest('GET', path);
    const raw = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    const { meta, body } = parseContent(raw);

    document.getElementById('f-name').value = filename.replace(/\.md$/i, '');
    editor.value = body;
    currentSha = data.sha;
    markClean();
    setStatus(`✓ 已載入 ${path}`, 'ok');
  } catch (e) {
    setStatus(`✗ 載入失敗：${e.message}`, 'err');
  }
}

async function appendToGitHub() {
  const filename = getFilename();
  if (!filename) { setStatus('請填寫檔名', 'err'); return; }
  const appendContent = editor.value.trim();
  if (!appendContent) { setStatus('沒有內容可附加', 'err'); return; }

  setStatus('附加中…', 'busy');
  try {
    const path = getFullPath(filename);
    const { pat, owner, repo, branch } = getConfig();
    const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const headers = {
      'Authorization': `Bearer ${pat}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    // Try GET existing file
    const getRes = await fetch(apiBase, { headers });
    let newContent, sha;

    if (getRes.ok) {
      // File exists — append
      const data = await getRes.json();
      const existing = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      const ts = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Taipei' }).slice(0, 16);
      newContent = existing.trimEnd() + `\n\n---\n*附加於 ${ts}*\n\n` + appendContent;
      sha = data.sha;
    } else if (getRes.status === 404) {
      // File does not exist — create new
      newContent = appendContent;
      sha = null;
    } else {
      const err = await getRes.json();
      throw new Error(err.message || `HTTP ${getRes.status}`);
    }

    const encoded = btoa(unescape(encodeURIComponent(newContent)));
    const payload = {
      message: sha ? `docs: append to ${filename}` : `docs: create ${filename}`,
      content: encoded,
      branch,
    };
    if (sha) payload.sha = sha;

    const putRes = await fetch(apiBase, { method: 'PUT', headers, body: JSON.stringify(payload) });
    const result = await putRes.json();
    if (!putRes.ok) throw new Error(result.message || `HTTP ${putRes.status}`);

    currentSha = result.content.sha;
    editor.value = '';
    markClean();
    setStatus(sha ? `✓ 已附加至 → ${path}` : `✓ 已建立 → ${path}`, 'ok');
  } catch (e) {
    setStatus(`✗ 附加失敗：${e.message}`, 'err');
  }
}

// ─────────────────────────────────────────────
//  New note
// ─────────────────────────────────────────────
function newNote() {
  if (isDirty && !confirm('目前有未儲存的變更，確定要新增？')) return;
  document.getElementById('f-name').value   = '';
  document.getElementById('f-source').value = '';
  document.getElementById('f-tags').value   = '';
  editor.value = '';
  currentSha = null;
  markClean();
  document.getElementById('f-name').focus();
  setStatus('已清空，請輸入新筆記', '');
}

async function overwriteToGitHub() {
  const filename = getFilename();
  if (!filename) { setStatus('請填寫檔名', 'err'); return; }
  if (!confirm(`⚠️ 覆蓋寫入會完全取代 GitHub 上的「${filename}」，確定繼續？`)) return;

  setStatus('覆蓋寫入中…', 'busy');
  try {
    const path = getFullPath(filename);
    const { pat, owner, repo, branch } = getConfig();
    const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const headers = {
      'Authorization': `Bearer ${pat}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    // GET current SHA if file exists
    const getRes = await fetch(apiBase, { headers });
    let sha = null;
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    } else if (getRes.status !== 404) {
      const err = await getRes.json();
      throw new Error(err.message || `HTTP ${getRes.status}`);
    }

    const encoded = btoa(unescape(encodeURIComponent(editor.value)));
    const payload = { message: `docs: overwrite ${filename}`, content: encoded, branch };
    if (sha) payload.sha = sha;

    const putRes = await fetch(apiBase, { method: 'PUT', headers, body: JSON.stringify(payload) });
    const result = await putRes.json();
    if (!putRes.ok) throw new Error(result.message || `HTTP ${putRes.status}`);

    currentSha = result.content.sha;
    markClean();
    setStatus(`✓ 已覆蓋寫入 → ${path}`, 'ok');
  } catch (e) {
    setStatus(`✗ 覆蓋寫入失敗：${e.message}`, 'err');
  }
}

// ─────────────────────────────────────────────
//  List files from GitHub
// ─────────────────────────────────────────────
async function listFromGitHub() {
  setStatus('列表載入中…', 'busy');
  try {
    const { pat, owner, repo, branch, prefix } = getConfig();
    if (!pat || !owner || !repo) throw new Error('請先在設定中填入 GitHub PAT、Owner 和 Repo。');

    const headers = {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    const dirPath = prefix ? prefix.replace(/\/$/, '') : '';
    const contentsUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}?ref=${branch || 'main'}`;
    const res = await fetch(contentsUrl, { headers });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    const files = await res.json();
    const mdFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.md'));

    if (mdFiles.length === 0) {
      editor.value = '（此目錄下沒有 Markdown 檔案）';
      document.getElementById('f-name').value = '';
      currentSha = null;
      markClean();
      setStatus('沒有找到 .md 檔案', '');
      return;
    }

    // Fetch last commit date for each file in parallel
    const datePromises = mdFiles.map(f =>
      fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(f.path)}&per_page=1&sha=${branch || 'main'}`, { headers })
        .then(r => r.json())
        .then(commits => commits[0]?.commit?.committer?.date || commits[0]?.commit?.author?.date || '')
        .catch(() => '')
    );
    const dates = await Promise.all(datePromises);

    const lines = ['# GitHub 檔案列表\n'];
    lines.push('| 檔名 | 大小 | 日期 |');
    lines.push('|------|-----:|------|');
    mdFiles.forEach((f, i) => {
      const size = f.size >= 1024 ? `${(f.size / 1024).toFixed(1)} KB` : `${f.size} B`;
      const date = dates[i] ? dates[i].slice(0, 10) : '—';
      lines.push(`| ${f.name} | ${size} | ${date} |`);
    });

    editor.value = lines.join('\n');
    document.getElementById('f-name').value = '';
    currentSha = null;
    markClean();
    setStatus(`✓ 找到 ${mdFiles.length} 個 .md 檔案`, 'ok');
  } catch (e) {
    setStatus(`✗ 列表失敗：${e.message}`, 'err');
  }
}

function applyTemplate(key) {

// ─────────────────────────────────────────────
//  Keyboard shortcuts
// ─────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    appendToGitHub();
  }

});

// Tab key indentation in editor
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end   = editor.selectionEnd;
    editor.setRangeText('  ', start, end, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});

// ─────────────────────────────────────────────
//  Cursor insertion helper
// ─────────────────────────────────────────────
function insertAtCursor(text) {
  const start = editor.selectionStart;
  const end   = editor.selectionEnd;
  editor.setRangeText(text, start, end, 'end');
  editor.dispatchEvent(new Event('input'));
  editor.focus();
}

// ─────────────────────────────────────────────
//  Voice Input (webkitSpeechRecognition — iOS Safari, HTTPS required)
// ─────────────────────────────────────────────
let voiceRecognition = null;
let isRecording = false;

function toggleVoice() {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    setStatus('⚠️ 語音輸入需要 HTTPS，請透過 GitHub Pages 或 HTTPS 網址開啟', 'err');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus('⚠️ 此瀏覽器不支援語音辨識（請用 iOS Safari 或 Chrome）', 'err');
    return;
  }

  if (isRecording) {
    voiceRecognition.stop();
    return;
  }

  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = 'zh-TW';
  voiceRecognition.interimResults = false;
  voiceRecognition.maxAlternatives = 1;
  voiceRecognition.continuous = false;

  const voiceBtn = document.getElementById('voice-btn');

  voiceRecognition.onstart = () => {
    isRecording = true;
    voiceBtn.textContent = '⏹ 停止';
    voiceBtn.classList.add('recording');
    setStatus('🎤 錄音中…請說話', 'busy');
  };

  voiceRecognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    insertAtCursor(transcript);
    setStatus(`✓ 已插入語音：「${transcript.slice(0, 20)}${transcript.length > 20 ? '…' : ''}」`, 'ok');
  };

  voiceRecognition.onerror = (e) => {
    const msgs = {
      'not-allowed': '請允許麥克風權限',
      'network':     '網路錯誤，請檢查連線',
      'no-speech':   '未偵測到語音',
      'aborted':     '已取消',
    };
    setStatus(`⚠️ 語音錯誤：${msgs[e.error] || e.error}`, 'err');
  };

  voiceRecognition.onend = () => {
    isRecording = false;
    voiceBtn.textContent = '🎤 語音';
    voiceBtn.classList.remove('recording');
    if (status.className === 'busy') {
      setStatus('（未偵測到語音）', '');
    }
  };

  voiceRecognition.start();
}

// ─────────────────────────────────────────────
//  Camera / Photo OCR
// ─────────────────────────────────────────────
let selectedPhotoDataUrl = null;

function openPhotoPicker() {
  document.getElementById('photo-input').click();
}

document.getElementById('photo-input').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedPhotoDataUrl = e.target.result;
    document.getElementById('ocr-filename').textContent = `已選擇圖片：${file.name}`;
    document.getElementById('ocr-panel').classList.add('open');
    setStatus('請選擇辨識模式', '');
  };
  reader.readAsDataURL(file);
  this.value = '';
});

function closeOcrPanel() {
  document.getElementById('ocr-panel').classList.remove('open');
  selectedPhotoDataUrl = null;
}

async function runOCR(mode) {
  if (!selectedPhotoDataUrl) { setStatus('未選擇圖片', 'err'); return; }
  closeOcrPanel();
  if (mode === 'rough') {
    await runTesseractOCR();
  } else {
    await runClaudeOCR();
  }
}

// ── Tesseract.js lazy loader ──
let tesseractLoaded = false;

function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (tesseractLoaded) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => { tesseractLoaded = true; resolve(); };
    s.onerror = () => reject(new Error('Tesseract.js 載入失敗，請檢查網路連線'));
    document.head.appendChild(s);
  });
}

async function runTesseractOCR() {
  setStatus('載入 Tesseract.js…', 'busy');
  try {
    await loadTesseract();
  } catch (e) {
    setStatus(`✗ ${e.message}`, 'err');
    return;
  }
  setStatus('初始化辨識引擎（首次需下載語言包）…', 'busy');
  let worker;
  try {
    worker = await Tesseract.createWorker(['chi_tra', 'eng'], 1, {
      logger: (m) => {
        if (m.status === 'recognizing text' && m.progress) {
          setStatus(`OCR 辨識中… ${Math.round(m.progress * 100)}%`, 'busy');
        }
      },
    });
    const { data: { text } } = await worker.recognize(selectedPhotoDataUrl);
    const trimmed = text.trim();
    if (!trimmed) { setStatus('⚠️ 未辨識到文字', ''); return; }
    insertAtCursor(trimmed);
    setStatus(`✓ Tesseract OCR 完成（${trimmed.length} 字元）`, 'ok');
  } catch (e) {
    const hint = e.message?.includes('message channel') ? '請改用無痕視窗（停用擴充功能）' : e.message;
    setStatus(`✗ OCR 失敗：${hint}`, 'err');
  } finally {
    if (worker) worker.terminate();
  }
}

async function runClaudeOCR() {
  const { claudeKey } = getConfig();
  if (!claudeKey) {
    setStatus('⚠️ 請先在設定中填入 Claude API Key', 'err');
    return;
  }
  setStatus('Claude Vision OCR 中…', 'busy');
  try {
    const [header, base64Data] = selectedPhotoDataUrl.split(',');
    const mediaType = header.match(/data:([^;]+)/)[1];
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type':                              'application/json',
        'x-api-key':                                 claudeKey,
        'anthropic-version':                         '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model:      'claude-haiku-4-5-20251001',
        max_tokens: 2048,
        messages: [{
          role: 'user',
          content: [
            {
              type:   'image',
              source: { type: 'base64', media_type: mediaType, data: base64Data },
            },
            {
              type: 'text',
              text: '請提取這張圖片中的所有文字，盡量保留原有的排版格式（換行、縮排、標點符號）。只輸出提取到的文字，不需要額外說明。',
            },
          ],
        }],
      }),
    });
    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }
    const data = await response.json();
    const text = data.content[0]?.text?.trim() || '';
    if (!text) { setStatus('⚠️ Claude 未提取到文字', ''); return; }
    insertAtCursor(text);
    setStatus(`✓ Claude OCR 完成（${text.length} 字元）`, 'ok');
  } catch (e) {
    setStatus(`✗ Claude OCR 失敗：${e.message}`, 'err');
  }
}
